        /* 19世紀簡約古典風格 */
        body {
            background-color: #f4edd2; /* 仿舊紙張色 */
            color: #2b251f; /* 深碳焦黑 */
            font-family: "Times New Roman", "Georgia", "Noto Serif TC", "Songti TC", serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        #survey-container {
            max-width: 600px;
            width: 100%;
            border: 1px solid #a1947b;
            padding: 50px 40px;
            background-color: #fbf8eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.5s ease, border-color 0.5s ease;
        }

        /* 裝飾性雙邊框細線 */
        #survey-container::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px solid #d3c9b3;
            pointer-events: none;
            transition: border-color 0.5s ease;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px double #a1947b;
            padding-bottom: 30px;
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }

        .author {
            font-size: 14px;
            font-style: italic;
            color: #5c5146;
            margin: 0 0 25px 0;
            letter-spacing: 1px;
        }

        .introduction {
            font-size: 15px;
            line-height: 1.8;
            color: #4a3f35;
            max-width: 450px;
            margin: 0 auto;
            text-align: justify;
        }

        /* 互動區域 */
        .content-section {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .progress-indicator {
            font-size: 14px;
            font-style: italic;
            color: #7a6f62;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
        }

        /* 選項清單樣式 */
        .options-list {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .option-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #2b251f;
            border: 1px solid #d3c9b3;
            text-align: left;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .option-item:hover:not(:disabled) {
            background-color: #f4edd2;
            border-color: #a1947b;
        }

        /* 被選中的選項樣式 */
        .option-item.selected {
            background-color: #2b251f;
            color: #fbf8eb;
            border-color: #2b251f;
        }

        /* 選項禁用/反灰狀態 */
        .option-item:disabled {
            background-color: #e8e3cf !important;
            color: #a1947b !important;
            border-color: #cbd2be !important;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-container {
            text-align: center;
            width: 100%;
        }
