<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口腔健康與習慣調查</title>
    <style>
        /* 19世紀簡約古典風格 */
        body {
            background-color: #f4edd2; /* 仿舊紙張色 */
            color: #2b251f; /* 深碳焦黑 */
            font-family: "Times New Roman", "Georgia", "Noto Serif TC", "Songti TC", serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        #survey-container {
            max-width: 600px;
            width: 100%;
            border: 1px solid #a1947b;
            padding: 50px 40px;
            background-color: #fbf8eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.5s ease, border-color 0.5s ease;
        }

        /* 裝飾性雙邊框細線 */
        #survey-container::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px solid #d3c9b3;
            pointer-events: none;
            transition: border-color 0.5s ease;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px double #a1947b;
            padding-bottom: 30px;
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }

        .author {
            font-size: 14px;
            font-style: italic;
            color: #5c5146;
            margin: 0 0 25px 0;
            letter-spacing: 1px;
        }

        .introduction {
            font-size: 15px;
            line-height: 1.8;
            color: #4a3f35;
            max-width: 450px;
            margin: 0 auto;
            text-align: justify;
        }

        /* 互動區域 */
        .content-section {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .progress-indicator {
            font-size: 14px;
            font-style: italic;
            color: #7a6f62;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
        }

        /* 選項清單樣式 */
        .options-list {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .option-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #2b251f;
            border: 1px solid #d3c9b3;
            text-align: left;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .option-item:hover:not(:disabled) {
            background-color: #f4edd2;
            border-color: #a1947b;
        }

        /* 被選中的選項樣式 */
        .option-item.selected {
            background-color: #2b251f !important;
            color: #fbf8eb !important;
            border-color: #2b251f !important;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 選項禁用/反灰狀態 */
        .option-item:disabled {
            background-color: #e8e3cf !important;
            color: #a1947b !important;
            border-color: #cbd2be !important;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-container {
            text-align: center;
            width: 100%;
        }

        button.action-btn {
            background-color: transparent;
            color: #2b251f;
            border: 1px solid #2b251f;
            padding: 10px 28px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        button.action-btn:hover:not(:disabled) {
            background-color: #2b251f;
            color: #fbf8eb;
        }

        button.action-btn:disabled {
            border-color: #d3c9b3;
            color: #a1947b;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 古典風格提示框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(43, 37, 31, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: #fbf8eb;
            border: 1px solid #a1947b;
            padding: 35px 30px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .modal-box::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid #d3c9b3;
            pointer-events: none;
        }

        .modal-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #2b251f;
            font-style: italic;
        }

        /* 第 8 題專用：二次錯誤時提示文字變紅的樣式 */
        .modal-text.warning-red {
            color: #ff1a1a !important;
        }

        /* 全黑過場遮罩 */
        .blackout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .blackout-text {
            color: #ffffff;
            font-size: 24px;
            letter-spacing: 4px;
            font-family: inherit;
        }

        /* 第8題專用：徹底充斥整個螢幕的紅色文字處罰畫面 */
        #red-punishment-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #ff1a1a;
            font-size: 38px;
            font-weight: bold;
            font-style: italic;
            z-index: 3000;
            letter-spacing: 4px;
            line-height: 1.4;
            overflow: hidden;
            word-break: break-all;
            user-select: none;
            padding: 0;
            margin: 0;
        }

        .text-filler {
            width: 120%;
            height: 120%;
            margin-left: -10%;
            margin-top: -5%;
            text-align: justify;
        }

        /* 1.5秒選項閃爍變形動畫 */
        @keyframes glitch-flicker {
            0% { opacity: 1; }
            20% { opacity: 0.2; }
            40% { opacity: 0.
