<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>口腔健康與習慣調查</title>
    <style>
        body { background-color: #f4edd2; color: #2b251f; font-family: "Times New Roman", "Georgia", serif; margin: 0; padding: 40px 20px; transition: background-color 0.5s ease; }
        #survey-container { max-width: 600px; margin: auto; border: 1px solid #a1947b; padding: 50px 40px; background-color: #fbf8eb; position: relative; }
        .hidden { display: none !important; }
        .option-item { display: block; width: 100%; padding: 12px 15px; margin-bottom: 10px; background: transparent; border: 1px solid #d3c9b3; cursor: pointer; text-align: left; }
        .option-item.selected { background-color: #2b251f !important; color: #fbf8eb !important; }
        .red-text { color: #ff1a1a !important; }
        .shake-forever { animation: constant-shake 0.2s infinite; }
        @keyframes constant-shake { 0%, 100% { transform: translate(0); } 50% { transform: translate(-2px, 2px); } }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
        .modal-box { background: #fbf8eb; padding: 30px; border: 1px solid #a1947b; }
        body.forced-dark { background-color: #0a0a0a; color: #8a8275; }
        #red-punishment-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; color: #f00; font-size: 30px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="survey-container">
        <div id="welcome-screen">
            <h1>口腔健康與習慣調查</h1>
            <button class="action-btn" onclick="startSurvey()">開始作答</button>
        </div>
        <div id="question-screen" class="hidden">
            <div id="progress"></div>
            <div id="question-text"></div>
            <div id="options-container"></div>
            <button id="next-btn" disabled onclick="nextQuestion()">下一題</button>
        </div>
    </div>
    
    <div id="hint-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="modal-content"></div>
            <button onclick="closeModal()">關閉</button>
        </div>
    </div>
    
    <div id="red-punishment-screen" class="hidden">處罰中...</div>

    <script>
        const questions = [
            { question: "1. 您刷牙的頻率？", options: ["餐後", "早晚", "隨意", "不刷"] },
            { question: "2. 是否使用牙粉？", options: ["每次", "偶爾", "不", "那是什麼"] },
            { question: "3. 是否使用漱口水？", options: ["每天", "偶爾", "很少", "不"] },
            { question: "4. 是否曾罹患齲齒？", options: ["從未", "已治療", "未治療", "什麼是齲齒？"], hints: [null, null, "建議就醫", "是蛀牙"] },
            { question: "5. 是否固定看牙醫？", options: ["每半年", "每年", "有狀況才看", "從未看過"], hints: ["乖孩子", "還能更好", "不好習慣", "……"] },
            { question: "6. 是否知道根管治療？", options: ["了解", "大概", "不清", "沒聽過"] },
            { question: "7. 是否相信光療法？", options: ["深信", "相信", "不信", "什麼是光療法？"], isQ7: true },
            { question: "8. 是否相信我？", options: ["當然", "也許會", "也許不會", "拒絕相信"], isQ8: true },
            { question: "9. 甜點飲料頻率？", options: ["每天", "經常", "很少", "幾乎沒有"] },
            { question: "10. 是否矯正？", options: ["正在", "曾經", "未來計畫", "不曾"] },
            { question: "11. 聽過沼澤故事嗎？", options: ["……沒有", "怪物", "牙醫", "“牙醫”"], isQ11: true },
            { question: "12. 進入診療室？", options: ["願意", "願意", "願意", "願意"], isQ12: true },
            { question: "13. 接受檢查？", options: ["願意"], isQ13: true }
        ];

        let cur = 0;
        let q8Wrong = 0;

        function startSurvey() { document.getElementById('welcome-screen').classList.add('hidden'); document.getElementById('question-screen').classList.remove('hidden'); loadQ(); }

        function loadQ() {
            const data = questions[cur];
            document.getElementById('question-text').innerText = data.question;
            const cont = document.getElementById('options-container'); cont.innerHTML = '';
            data.options.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = 'option-item';
                b.innerText = opt;
                if (data.isQ13) b.className += ' shake-forever';
                b.onclick = () => select(i, b);
                cont.appendChild(b);
            });
            document.getElementById('next-btn').disabled = true;
        }

        function select(i, btn) {
            const data = questions[cur];
            if (data.isQ7 && i !== 0) { btn.innerText = "深信不疑"; document.getElementById('next-btn').disabled = false; }
            else if (data.isQ8 && i !== 0) { 
                q8Wrong++;
                if (q8Wrong >= 2) document.body.classList.add('forced-dark');
                if (q8Wrong >= 3) { document.getElementById('red-punishment-screen').classList.remove('hidden'); setTimeout(() => document.getElementById('red-punishment-screen').classList.add('hidden'), 2000); }
                else { document.getElementById('modal-content').innerText = "為什麼？"; document.getElementById('hint-modal').classList.remove('hidden'); }
            }
            else if (data.isQ11) { btn.innerText = ["Long long ago...", "Monsters roam", "Mystery land", "Welcome to swamp"][i]; btn.classList.add('red-text'); document.getElementById('next-btn').disabled = false; }
            else if (data.isQ12) { document.getElementById('modal-content').innerText = "……非常好！"; document.getElementById('hint-modal').classList.remove('hidden'); document.getElementById('next-btn').disabled = false; }
            else if (data.isQ13) { btn.classList.remove('shake-forever'); document.getElementById('next-btn').disabled = false; }
            else { document.querySelectorAll('.option-item').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); document.getElementById('next-btn').disabled = false; }
        }

        function nextQuestion() { cur++; if(cur < questions.length) loadQ(); else alert("結束"); }
        function closeModal() { document.getElementById('hint-modal').classList.add('hidden'); }
    </script>
</body>
</html>
