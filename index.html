<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口腔健康與習慣調查</title>
    <style>
        body { background-color: #f4edd2; color: #2b251f; font-family: "Times New Roman", "Georgia", "Noto Serif TC", "Songti TC", serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; transition: background-color 0.5s ease, color 0.5s ease; }
        #survey-container { max-width: 600px; width: 100%; border: 1px solid #a1947b; padding: 50px 40px; background-color: #fbf8eb; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); position: relative; box-sizing: border-box; transition: background-color 0.5s ease, border-color 0.5s ease; }
        #survey-container::before { content: ""; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border: 1px solid #d3c9b3; pointer-events: none; transition: border-color 0.5s ease; }
        .header-section { text-align: center; margin-bottom: 40px; border-bottom: 1px double #a1947b; padding-bottom: 30px; }
        h1 { font-size: 26px; font-weight: normal; letter-spacing: 2px; margin: 0 0 10px 0; }
        .author { font-size: 14px; font-style: italic; color: #5c5146; margin: 0 0 25px 0; letter-spacing: 1px; }
        .introduction { font-size: 15px; line-height: 1.8; color: #4a3f35; max-width: 450px; margin: 0 auto; text-align: justify; }
        .content-section { min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        .progress-indicator { font-size: 14px; font-style: italic; color: #7a6f62; margin-bottom: 15px; letter-spacing: 1px; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 25px; text-align: center; font-weight: normal; }
        .options-list { width: 100%; max-width: 400px; margin-bottom: 30px; }
        .option-item { display: block; width: 100%; padding: 12px 15px; margin-bottom: 10px; background-color: transparent; color: #2b251f; border: 1px solid #d3c9b3; text-align: left; font-family: inherit; font-size: 15px; cursor: pointer; transition: all 0.2s ease; box-sizing: border-box; }
        .option-item:hover:not(:disabled) { background-color: #f4edd2; border-color: #a1947b; }
        .option-item.selected { background-color: #2b251f !important; color: #fbf8eb !important; border-color: #2b251f !important; pointer-events: none; user-select: none; }
        .option-item:disabled { background-color: #e8e3cf !important; color: #a1947b !important; border-color: #cbd2be !important; cursor: not-allowed; opacity: 0.5; }
        .red-text-trigger { color: #ff1a1a !important; border-color: #ff1a1a !important; font-weight: bold; }
        .btn-container { text-align: center; width: 100%; }
        button.action-btn { background-color: transparent; color: #2b251f; border: 1px solid #2b251f; padding: 10px 28px; font-family: inherit; font-size: 15px; cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px; }
        button.action-btn:hover:not(:disabled) { background-color: #2b251f; color: #fbf8eb; }
        button.action-btn:disabled { border-color: #d3c9b3; color: #a1947b; cursor: not-allowed; opacity: 0.6; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(43, 37, 31, 0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background-color: #fbf8eb; border: 1px solid #a1947b; padding: 35px 30px; max-width: 400px; width: 85%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; }
        .modal-box::before { content: ""; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; border: 1px solid #d3c9b3; pointer-events: none; }
        .modal-text { font-size: 16px; line-height: 1.6; margin-bottom: 25px; color: #2b251f; font-style: italic; }
        .modal-text.warning-red { color: #ff1a1a !important; }
        .blackout-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .blackout-text { color: #ffffff; font-size: 24px; letter-spacing: 4px; font-family: inherit; }
        #red-punishment-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; color: #ff1a1a; font-size: 38px; font-weight: bold; font-style: italic; z-index: 3000; letter-spacing: 4px; line-height: 1.4; overflow: hidden; word-break: break-all; padding: 0; margin: 0; }
        .text-filler { width: 120%; height: 120%; margin-left: -10%; margin-top: -5%; text-align: justify; }
        @keyframes glitch-flicker { 0% { opacity: 1; } 20% { opacity: 0.2; } 40% { opacity: 0.9; } 60% { opacity: 0.1; } 80% { opacity: 0.8; } 100% { opacity: 1; } }
        .glitch-active { animation: glitch-flicker 0.25s ease-in-out; }
        @keyframes item-shake { 0% { transform: translateX(0); } 10% { transform: translateX(-8px); } 20% { transform: translateX(8px); } 100% { transform: translateX(0); } }
        .item-shake-active { animation: item-shake 0.4s ease-in-out; }
        body.forced-dark { background-color: #0a0a0a !important; color: #8a8275 !important; }
        body.forced-dark #survey-container { background-color: #121212 !important; border-color: #444444 !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="survey-container">
        <div id="welcome-screen">
            <div class="header-section">
                <h1>口腔健康與習慣調查</h1>
                <div class="author">芬森·亨特</div>
                <p class="introduction">本問卷旨在調查口腔健康與衛生習慣，請依據您的習慣作答。</p>
            </div>
            <div class="content-section"><div class="btn-container"><button class="action-btn" onclick="startSurvey()">開始作答</button></div></div>
        </div>

        <div id="question-screen" class="hidden">
            <div class="content-section">
                <div id="progress" class="progress-indicator"></div>
                <div id="question-text" class="question-text"></div>
                <div id="options-container" class="options-list"></div>
                <div class="btn-container"><button id="next-btn" class="action-btn" onclick="nextQuestion()" disabled>下一題</button></div>
            </div>
        </div>

        <div id="end-screen" class="hidden">
            <div class="header-section">
                <h1>調查結束</h1>
                <p class="introduction" style="text-align: center;">感謝您的參與。數據已記錄。</p>
            </div>
        </div>
    </div>

    <div id="hint-modal" class="modal-overlay hidden"><div class="modal-box"><div id="modal-content" class="modal-text"></div><button class="action-btn" onclick="closeModal()">關閉</button></div></div>
    <div id="blackout-screen" class="blackout-overlay hidden"><div id="blackout-content" class="blackout-text">這就對了</div></div>
    <div id="red-punishment-screen" class="hidden"><div id="matrix-filler" class="text-filler"></div></div>

    <script>
        const questions = [
            { question: "1. 您刷牙的頻率如何？", options: [{ text: "餐後刷牙" }, { text: "早/晚刷牙" }, { text: "想到才刷牙" }, { text: "幾乎不刷牙" }] },
            { question: "2. 您刷牙時是否使用牙粉？", options: [{ text: "每次都使用" }, { text: "偶爾使用" }, { text: "從不使用" }, { text: "……那是什麼？" }] },
            { question: "3. 您是否使用漱口水？", options: [{ text: "每天使用" }, { text: "偶爾使用" }, { text: "很少使用" }, { text: "從不使用" }] },
            { question: "4. 您是否曾罹患齲齒？", options: [{ text: "從未" }, { text: "曾罹患，已治療" }, { text: "目前罹患，未治療", hint: "建議盡快就醫", hintId: "q4_c" }, { text: "什麼是齲齒？", hint: "是蛀牙的意思呢", hintId: "q4_d" }] },
            { question: "5. 您是否固定至牙科看診？", options: [{ text: "每半年一次或更多", hint: "乖孩子……", hintId: "q5_a" }, { text: "每年一次或更少", hint: "還能再進步呢……", hintId: "q5_b" }, { text: "有狀況才看診", hint: "這並不是好習慣……", hintId: "q5_c" }, { text: "從未看過牙科", hint: "……", hintId: "q5_d" }] },
            { question: "6. 您是否知道什麼是「根管治療」？", options: [{ text: "十分了解" }, { text: "大概知道" }, { text: "不太清楚" }, { text: "從未聽說" }] },
            { question: "7. 您是否相信「光療法」？", isSpecialQ7: true, options: [{ text: "深信不疑" }, { text: "相信" }, { text: "不相信" }, { text: "光療法是什麼？" }] },
            { question: "8. 您是否相信我……？", isSpecialQ8: true, options: [{ initial: "……什麼？", final: "當然" }, { initial: "……什麼？", final: "也許會", hint: "還不夠", hintId: "q8_b" }, { initial: "……什麼？", final: "也許會不會" }, { initial: "……什麼？", final: "拒絕相信" }] },
            { question: "9. 您食用甜點或含糖飲料的頻率如何？", options: [{ text: "每天" }, { text: "經常" }, { text: "很少" }, { text: "幾乎沒有" }] },
            { question: "10. 您是否接受過牙齒矯正？", options: [{ text: "正在進行" }, { text: "曾經有" }, { text: "未來計畫進行" }, { text: "不曾且無計畫接受" }] },
            { question: "11. 您聽說過關於沼澤的「故事」嗎？", isSpecialQ11: true, options: [{ text: "……沒有", secret: "Long long ago, a tale was born" }, { text: "聽過怪物的故事", secret: "In the mist, monsters roam" }, { text: "聽過牙醫的故事", secret: "A land of mystery, a hunting ground" }, { text: "聽過“牙醫”的故事", secret: "Welcome to the dentist's swamp" }] }
        ];

        questions[7].options[2].final = "也許不會";
        let currentQuestionIndex = 0, selectedOptionIndex = null, q8WrongCount = 0, q8TextsRevealed = false, triggeredHints = {};

        function startSurvey() { document.getElementById('welcome-screen').classList.add('hidden'); document.getElementById('question-screen').classList.remove('hidden'); loadQuestion(); }

        function loadQuestion() {
            selectedOptionIndex = null; document.getElementById('next-btn').disabled = true;
            const data = questions[currentQuestionIndex];
            document.getElementById('progress').innerText = `${currentQuestionIndex + 1} / 11`;
            document.getElementById('question-text').innerText = data.question;
            const container = document.getElementById('options-container'); container.innerHTML = '';
            const labels = ['A. ', 'B. ', 'C. ', 'D. '];

            data.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-item'; btn.id = `opt-${idx}`;
                if (data.isSpecialQ8) {
                    btn.innerText = labels[idx] + (q8TextsRevealed ? opt.final : opt.initial);
                } else if (data.isSpecialQ11) {
                    btn.innerText = opt.text;
                } else {
                    btn.innerText = labels[idx] + opt.text;
                }
                btn.onclick = () => selectOption(idx, opt.hint, opt.hintId);
                container.appendChild(btn);
            });

            if (data.isSpecialQ8 && !q8TextsRevealed) {
                setTimeout(() => {
                    q8TextsRevealed = true;
                    data.options.forEach((opt, idx) => {
                        const b = document.getElementById(`opt-${idx}`);
                        b.classList.add('glitch-active'); b.innerText = labels[idx] + opt.final;
                    });
                }, 800);
            }
        }

        function selectOption(idx, hint, hintId) {
            const data = questions[currentQuestionIndex];
            if (data.isSpecialQ11) {
                const b = document.getElementById(`opt-${idx}`);
                b.innerText = data.options[idx].secret; b.classList.add('red-text-trigger', 'selected');
                document.querySelectorAll('.option-item').forEach(b => b.disabled = true);
                document.getElementById('next-btn').disabled = false;
                return;
            }
            if (data.isSpecialQ7) {
                selectedOptionIndex = idx;
                const b = document.getElementById(`opt-${idx}`);
                document.querySelectorAll('.option-item').forEach(it => it.classList.remove('selected'));
                b.classList.add('selected');
                if (idx !== 0) {
                    b.classList.add('item-shake-active');
                    setTimeout(() => { b.innerText = "A. 深信不疑"; document.getElementById('next-btn').disabled = false; }, 400);
                } else { document.getElementById('next-btn').disabled = false; }
                return;
            }
            if (data.isSpecialQ8 && idx !== 0) {
                q8WrongCount++;
                if (q8WrongCount >= 2) document.body.classList.add('forced-dark');
                if (q8WrongCount >= 3) {
                    document.getElementById('matrix-filler').innerText = Array(800).fill("為什麼").join("");
                    document.getElementById('red-punishment-screen').classList.remove('hidden');
                    setTimeout(() => { document.getElementById('red-punishment-screen').classList.add('hidden'); loadQuestion(); }, 3000);
                } else {
                    document.getElementById('modal-content').innerText = hint || "……為什麼？";
                    document.getElementById('hint-modal').classList.remove('hidden');
                }
                return;
            }
            selectedOptionIndex = idx;
            document.querySelectorAll('.option-item').forEach((it, i) => it.className = (i === idx ? 'option-item selected' : 'option-item'));
            if (hint && !triggeredHints[hintId]) { triggeredHints[hintId] = true; document.getElementById('modal-content').innerText = hint; document.getElementById('hint-modal').classList.remove('hidden'); }
            else { document.getElementById('next-btn').disabled = false; }
        }

        function closeModal() { document.getElementById('hint-modal').classList.add('hidden'); document.getElementById('next-btn').disabled = false; }
        function nextQuestion() {
            if (questions[currentQuestionIndex].isSpecialQ7) {
                document.getElementById('blackout-screen').classList.remove('hidden');
                setTimeout(() => { document.getElementById('blackout-screen').classList.add('hidden'); proceed(); }, 2000);
            } else { proceed(); }
        }
        function proceed() { currentQuestionIndex++; if (currentQuestionIndex < questions.length) loadQuestion(); else { document.getElementById('question-screen').classList.add('hidden'); document.getElementById('end-screen').classList.remove('hidden'); } }
    </script>
</body>
</html>
