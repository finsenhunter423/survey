<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口腔健康與衛生習慣調查</title>
    <style>
        /* 19世紀簡約古典風格 */
        body {
            background-color: #f4edd2; /* 仿舊紙張色 */
            color: #2b251f; /* 深碳焦黑 */
            font-family: "Times New Roman", "Georgia", "Noto Serif TC", "Songti TC", serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        #survey-container {
            max-width: 600px;
            width: 100%;
            border: 1px solid #a1947b;
            padding: 50px 40px;
            background-color: #fbf8eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.5s ease, border-color 0.5s ease;
        }

        /* 裝飾性雙邊框細線 */
        #survey-container::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px solid #d3c9b3;
            pointer-events: none;
            transition: border-color 0.5s ease;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px double #a1947b;
            padding-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 2px;
            margin: 0 0 15px 0;
            line-height: 1.5;
        }

        .introduction {
            font-size: 16px;
            line-height: 1.8;
            color: #4a3f35;
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
            font-style: italic;
        }

        /* 互動區域 */
        .content-section {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .progress-indicator {
            font-size: 14px;
            font-style: italic;
            color: #7a6f62;
            margin-bottom: 15px;
            letter-spacing: 1px;
            transition: color 0.5s ease;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
            transition: color 0.5s ease;
        }

        /* 讓特定題目文字變紅的樣式 */
        .question-text.warning-red {
            color: #ff1a1a !important;
        }

        /* 選項清單樣式 */
        .options-list {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .option-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #2b251f;
            border: 1px solid #d3c9b3;
            text-align: left;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .option-item:hover:not(:disabled) {
            background-color: #f4edd2;
            border-color: #a1947b;
        }

        /* 被選中的選項樣式 */
        .option-item.selected {
            background-color: #2b251f !important;
            color: #fbf8eb !important;
            border-color: #2b251f !important;
        }

        /* 選項禁用/反灰狀態 */
        .option-item:disabled {
            background-color: #e8e3cf !important;
            color: #a1947b !important;
            border-color: #cbd2be !important;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-container {
            text-align: center;
            width: 100%;
        }

        button.action-btn {
            background-color: transparent;
            color: #2b251f;
            border: 1px solid #2b251f;
            padding: 10px 28px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        button.action-btn:hover:not(:disabled) {
            background-color: #2b251f;
            color: #fbf8eb;
        }

        button.action-btn:disabled {
            border-color: #d3c9b3;
            color: #a1947b;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 古典風格提示框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(43, 37, 31, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: #fbf8eb;
            border: 1px solid #a1947b;
            padding: 35px 30px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .modal-box::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid #d3c9b3;
            pointer-events: none;
        }

        .modal-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #2b251f;
            font-style: italic;
        }

        .modal-text.warning-red {
            color: #ff1a1a !important;
        }

        /* 過場遮罩 */
        .blackout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .blackout-text {
            color: #ffffff;
            font-size: 24px;
            letter-spacing: 4px;
            font-family: inherit;
        }

        /* 第8題專用處罰畫面 */
        #red-punishment-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #ff1a1a;
            font-size: 38px;
            font-weight: bold;
            font-style: italic;
            z-index: 3000;
            letter-spacing: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            padding: 0;
            margin: 0;
        }

        /* 變形動畫 */
        @keyframes glitch-flicker {
            0% { opacity: 1; }
            20% { opacity: 0.2; }
            40% { opacity: 0.9; }
            60% { opacity: 0.1; }
            80% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .glitch-active {
            animation: glitch-flicker 0.25s ease-in-out;
        }

        /* 全螢幕顫抖特效 */
        @keyframes screen-shake-anim {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-10px, -10px); }
            20% { transform: translate(10px, 10px); }
            30% { transform: translate(-10px, 10px); }
            40% { transform: translate(10px, -10px); }
            50% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            70% { transform: translate(-5px, 5px); }
            80% { transform: translate(5px, -5px); }
            90% { transform: translate(-2px, -2px); }
            100% { transform: translate(0, 0); }
        }
        .screen-shake {
            animation: screen-shake-anim 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* 高頻率選項抖動 */
        @keyframes item-shake {
            0% { transform: translateX(0); }
            10% { transform: translateX(-8px); }
            20% { transform: translateX(8px); }
            30% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            50% { transform: translateX(-6px); }
            60% { transform: translateX(6px); }
            70% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
            90% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }
        .item-shake-active {
            animation: item-shake 0.4s ease-in-out;
        }

        /* 第 11 題專用 */
        .option-item.q11-revealed {
            color: #ff1a1a !important;
            border-color: #ff1a1a !important;
        }
        .option-item.selected.q11-revealed {
            background-color: #2b251f !important;
            color: #ff5555 !important;
            border-color: #2b251f !important;
        }

        /* 第 13 題初始白字特效 */
        .option-item.q-white-text {
            color: #ffffff !important;
            border-color: #ffffff !important;
        }

        /* 第 13、15 題紅字選項 */
        .option-item.q-red {
            color: #ff1a1a !important;
            border-color: #ff1a1a !important;
        }
        .option-item.selected.q-red {
            background-color: #2b251f !important;
            color: #ff5555 !important;
            border-color: #2b251f !important;
        }

        /* 網頁整體被迫黑化 (第8題失敗等) */
        body.forced-dark {
            background-color: #0a0a0a !important;
            color: #8a8275 !important;
        }
        body.forced-dark #survey-container {
            background-color: #121212 !important;
            border-color: #444444 !important;
        }
        body.forced-dark #survey-container::before {
            border-color: #222222 !important;
        }
        body.forced-dark .option-item {
            color: #8a8275 !important;
            border-color: #333333 !important;
        }
        body.forced-dark .option-item:hover:not(:disabled) {
            background-color: #222222 !important;
        }
        body.forced-dark .option-item.selected {
            background-color: #8a8275 !important;
            color: #121212 !important;
        }
        body.forced-dark button.action-btn {
            color: #8a8275 !important;
            border-color: #8a8275 !important;
        }
        body.forced-dark button.action-btn:hover:not(:disabled) {
            background-color: #8a8275 !important;
            color: #121212 !important;
        }

        /* 第13~15題專用深黑背景模式 */
        body.deep-dark-mode {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        body.deep-dark-mode #survey-container {
            background-color: #050505 !important;
            border-color: #333333 !important;
        }
        body.deep-dark-mode #survey-container::before {
            border-color: #222222 !important;
        }
        body.deep-dark-mode .question-text {
            color: #ffffff; 
        }
        body.deep-dark-mode .question-text.warning-red {
            color: #ff1a1a !important; 
        }
        body.deep-dark-mode .progress-indicator {
            color: #555555 !important;
        }
        body.deep-dark-mode button.action-btn {
            color: #ffffff !important;
            border-color: #ffffff !important;
        }
        body.deep-dark-mode button.action-btn:hover:not(:disabled) {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        body.deep-dark-mode button.action-btn:disabled {
            border-color: #555555 !important;
            color: #555555 !important;
        }
        
        /* 第14~15題深黑模式下專用提示框樣式 */
        body.deep-dark-mode .modal-box {
            background-color: #000000 !important;
            border-color: #ffffff !important;
        }
        body.deep-dark-mode .modal-box::before {
            border-color: #333333 !important;
        }
        body.deep-dark-mode .modal-text {
            color: #ffffff !important;
        }
        body.deep-dark-mode .modal-text.warning-red {
            /* 回調為預設的警告紅字 */
            color: #ff1a1a !important;
        }
        body.deep-dark-mode .modal-box button.action-btn {
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 1px solid #ffffff !important;
        }
        body.deep-dark-mode .modal-box button.action-btn:hover:not(:disabled) {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        /* 確保紅字選項在深黑模式下依然保持紅色並正常反白 */
        body.deep-dark-mode .option-item.q-red {
            background-color: transparent !important;
            color: #ff1a1a !important;
            border-color: #ff1a1a !important;
        }
        body.deep-dark-mode .option-item.q-red:hover:not(:disabled) {
            background-color: #1a0000 !important;
        }
        body.deep-dark-mode .option-item.selected.q-red {
            background-color: #ff1a1a !important;
            color: #000000 !important;
            border-color: #ff1a1a !important;
        }

        .hidden {
            display: none !important;
        }

        /* ======== 結算畫面 ======== */
        #true-end-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            transition: background-color 2.5s ease;
        }

        #end-message {
            color: #ff1a1a;
            font-size: 26px;
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
            transition: opacity 0.5s;
        }

        #end-input-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        #final-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #ff1a1a;
            color: #ff1a1a;
            font-family: inherit;
            font-size: 20px;
            text-align: center;
            outline: none;
            width: 250px;
            padding: 5px;
            letter-spacing: 1px;
        }

        #final-input::placeholder {
            color: #550000;
            opacity: 1;
        }

        #final-submit {
            background: transparent;
            border: 1px solid #ff1a1a;
            color: #ff1a1a;
            cursor: pointer;
            font-size: 20px;
            padding: 5px 20px;
            transition: all 0.3s;
            font-family: inherit;
        }

        #final-submit:hover:not(:disabled) {
            background: #ff1a1a;
            color: #000000;
        }

        #final-submit:disabled {
            border-color: #550000;
            color: #550000;
            cursor: not-allowed;
            background: transparent;
        }

        #no-multiply-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            z-index: 10;
        }

        /* 確保重新開始按鈕在最後亮色背景下顯示為黑框黑字，不被黑夜模式覆蓋 */
        #restart-container button.action-btn {
            color: #2b251f !important;
            border-color: #2b251f !important;
            background-color: transparent !important;
        }
        #restart-container button.action-btn:hover:not(:disabled) {
            background-color: #2b251f !important;
            color: #fbf8eb !important;
        }
    </style>
</head>
<body>

    <div id="survey-container">
        
        <div id="welcome-screen">
            <div class="header-section">
                <h1>口腔健康與衛生習慣調查</h1>
                <p class="introduction">Finsen Hunter</p>
            </div>

            <div class="content-section">
                <div class="btn-container">
                    <button class="action-btn" onclick="startSurvey()">翻閱</button>
                </div>
            </div>
        </div>

        <div id="question-screen" class="hidden">
            <div class="content-section">
                <div id="progress" class="progress-indicator"></div>
                <div id="question-text" class="question-text"></div>
                <div id="options-container" class="options-list"></div>
                
                <div class="btn-container">
                    <button id="next-btn" class="action-btn" onclick="nextQuestion()" disabled>下一題</button>
                </div>
            </div>
        </div>

    </div>

    <div id="hint-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="modal-content" class="modal-text"></div>
            <div id="modal-btn-container" style="display: flex; justify-content: center; gap: 15px;">
                <button id="modal-close-btn" class="action-btn" onclick="closeModal()">關閉</button>
            </div>
        </div>
    </div>

    <div id="blackout-screen" class="blackout-overlay hidden">
        <div id="blackout-content" class="blackout-text">非常好……</div>
    </div>

    <div id="idle-blackout-screen" class="blackout-overlay hidden" style="z-index: 6000;">
        <div class="blackout-text" style="color: #ff1a1a; font-style: italic; font-size: 32px; font-weight: bold;">您在猶豫什麼呢？</div>
    </div>

    <div id="red-punishment-screen" class="hidden">
        <div id="matrix-filler"></div>
    </div>

    <div id="true-end-screen" class="hidden">
        <div id="no-multiply-container" class="hidden"></div>
        
        <div id="end-content-wrapper">
            <div id="end-message">Stay with me, would you?</div>
            <div id="end-input-area">
                <input type="text" id="final-input" placeholder="Yes" oninput="checkFinalInput()" onkeydown="handleFinalInput(event)">
                <button id="final-submit" onclick="submitFinal()">→</button>
            </div>
        </div>

        <div id="restart-container" class="hidden">
            <button class="action-btn" style="font-size: 16px; padding: 12px 35px;" onclick="window.location.reload()">Retry</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="The Dentist's Theme.mp3" type="audio/mpeg">
    </audio>

    <audio id="se-no">
        <source src="Ultraviolet Radiation.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 閒置時間計時器與次數統計
        let idleTime = 0;
        let questionTimeoutCount = 0;
        let endScreenTimeoutCount = 0;
        
        setInterval(() => {
            idleTime++;
            const targetQuestions = [6, 7, 10, 11, 12, 13, 14]; // 對應第 7, 8, 11, 12, 13, 14, 15 題
            
            let isQuestionScreen = !document.getElementById('question-screen').classList.contains('hidden');
            let isEndScreen = !document.getElementById('true-end-screen').classList.contains('hidden');
            
            // 題目畫面的超時黑屏邏輯
            if (isQuestionScreen && targetQuestions.includes(currentQuestionIndex)) {
                let isModalActive = !document.getElementById('hint-modal').classList.contains('hidden');
                let isPunishActive = !document.getElementById('red-punishment-screen').classList.contains('hidden');
                let isBlackoutActive = !document.getElementById('blackout-screen').classList.contains('hidden');
                let isIdleBlackoutActive = !document.getElementById('idle-blackout-screen').classList.contains('hidden');
                
                if (idleTime >= 15 && !isModalActive && !isPunishActive && !isBlackoutActive && !isIdleBlackoutActive) {
                    questionTimeoutCount++;
                    const idleScreen = document.getElementById('idle-blackout-screen');
                    const idleText = idleScreen.querySelector('.blackout-text');
                    
                    // 根據超時次數決定文字
                    if (questionTimeoutCount === 1) {
                        idleText.innerText = "您在猶豫什麼呢？";
                    } else if (questionTimeoutCount === 2) {
                        idleText.innerText = "……";
                    } else {
                        idleText.innerText = "請回答我……。";
                    }
                    
                    idleScreen.classList.remove('hidden');
                    idleTime = 0; 
                    
                    // 持續3秒後消失，並重置計時器，以利下一次計算
                    setTimeout(() => {
                        idleScreen.classList.add('hidden');
                        idleTime = 0; 
                    }, 3000);
                }
            }
            
            // 結算畫面的超時黑屏邏輯
            if (isEndScreen && !document.getElementById('final-input').disabled) {
                let isIdleBlackoutActive = !document.getElementById('idle-blackout-screen').classList.contains('hidden');
                
                if (idleTime >= 15 && !isIdleBlackoutActive) {
                    endScreenTimeoutCount++;
                    const idleScreen = document.getElementById('idle-blackout-screen');
                    const idleText = idleScreen.querySelector('.blackout-text');
                    
                    // 根據超時次數決定文字
                    if (endScreenTimeoutCount === 1) {
                        idleText.innerText = "I'm still waiting your answer.";
                    } else if (endScreenTimeoutCount === 2) {
                        idleText.innerText = "…";
                    } else {
                        idleText.innerText = "Don't leave alone…";
                    }
                    
                    idleScreen.classList.remove('hidden');
                    idleTime = 0;
                    
                    // 持續3秒後返回輸入畫面，並重置計時器
                    setTimeout(() => {
                        idleScreen.classList.add('hidden');
                        idleTime = 0;
                    }, 3000);
                }
            }
        }, 1000);

        function resetIdleTime() {
            idleTime = 0;
        }

        document.addEventListener('click', resetIdleTime);
        document.addEventListener('keydown', resetIdleTime);
        document.addEventListener('touchstart', resetIdleTime);

        const questions = [
            {
                question: "1. 您刷牙的頻率如何？",
                options: [{ text: "餐後刷牙" }, { text: "早/晚刷牙" }, { text: "想到才刷牙" }, { text: "幾乎不刷牙" }]
            },
            {
                question: "2. 您刷牙時是否使用牙粉(Tooth Powder)？",
                options: [{ text: "每次都使用" }, { text: "偶爾使用" }, { text: "從不使用" }, { text: "……那是什麼？" }]
            },
            {
                question: "3. 您是否使用漱口水？",
                options: [{ text: "每天使用" }, { text: "偶爾使用" }, { text: "很少使用" }, { text: "從不使用" }]
            },
            {
                question: "4. 您是否曾罹患齲齒？",
                options: [
                    { text: "從未" },
                    { text: "曾罹患，已治療" },
                    { text: "目前罹患，未治療", hint: "建議盡快就醫", hintId: "q4_c" },
                    { text: "什麼是齲齒？", hint: "是蛀牙的意思呢", hintId: "q4_d" }
                ]
            },
            {
                question: "5. 您是否固定至牙科看診？",
                options: [
                    { text: "每半年一次或更多", hint: "乖孩子……", hintId: "q5_a" },
                    { text: "每年一次或更少", hint: "還能再進步呢……", hintId: "q5_b" },
                    { text: "有狀況才看診", hint: "這並不是好習慣……", hintId: "q5_c" },
                    { text: "從未看過牙科", hint: "……", hintId: "q5_d" }
                ]
            },
            {
                question: "6. 您是否知道什麼是「根管治療」？",

            const btnContainer = document.getElementById('modal-btn-container');
            btnContainer.innerHTML = '<button id="modal-close-btn" class="action-btn" onclick="closeModal()">關閉</button>';

        function loadQuestion() {
            resetIdleTime(); 
            selectedOptionIndex = null;
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.innerText = '下一題'; 
            
            const currentData = questions[currentQuestionIndex];
            const questionTextEl = document.getElementById('question-text');
            
            if (currentQuestionIndex >= 12 && currentQuestionIndex <= 14) {
                document.body.classList.add('deep-dark-mode');
            } else {

            }
            
            document.getElementById('progress').innerText = `${currentQuestionIndex + 1} / 15`;

                    btn.className = 'option-item';
                    btn.id = `q8-opt-${index}`;
                    
                    if (disabledOptionsQ8[index]) {
                        btn.innerText = labels[index] + opt.final;
                        btn.disabled = true;
                    } else if (q8TextsRevealed) {
                        btn.innerText = labels[index] + opt.final;
                    } else {
                        btn.innerText = labels[index] + opt.initial;
                    }
                    
                    btn.onclick = () => selectOption(index, opt.hint, opt.hintId);
                    container.appendChild(btn);
                });

                if (!q8TextsRevealed) {
                    q8Timer = setTimeout(() => {
                        q8TextsRevealed = true;

                                btn.classList.add('glitch-active');
                                btn.innerText = labels[index] + opt.final;
                                setTimeout(() => btn.classList.remove('glitch-active'), 250);

                        });

                        btn.innerText = labels[index] + opt.revealed;

                    btn.onclick = () => selectOption(index, opt.hint, opt.hintId);
                    container.appendChild(btn);

        function selectOption(index, hint, hintId) {
            const currentData = questions[currentQuestionIndex];
            
            if (currentData.isSpecialQ7 || currentData.isSpecialQ12) {
                selectedOptionIndex = index;
                currentData.options[index].hasRevealed = true;
                
                const prefix = currentData.isSpecialQ7 ? 'q7' : 'q12';
                const items = document.querySelectorAll('.option-item');
                const labels = ['A. ', 'B. ', 'C. ', 'D. '];

                items.forEach((item, idx) => {
                    if (currentData.options[idx].hasRevealed) {
                        item.innerText = labels[idx] + currentData.options[idx].final;
                    } else {
                        item.innerText = labels[idx] + currentData.options[idx].initial;
                    }
                    
                    if (idx === index) {
                        item.classList.add('selected');
                        if (index !== 0) {
                            item.classList.remove('item-shake-active');
                            void item.offsetWidth;
                            item.classList.add('item-shake-active');
                        }
                    } else {
                        item.classList.remove('selected');
                    }
                });
                document.getElementById('next-btn').disabled = false;
                return;
            }
            
            if (currentData.isSpecialQ8 && index !== 0) {
                q8WrongCount++;
                disabledOptionsQ8[index] = true; 
                document.getElementById('next-btn').disabled = true;

                let shouldShowHint = false;
                if (hint && hintId && !triggeredHints[hintId]) {
                    triggeredHints[hintId] = true;
                    shouldShowHint = true;
                }

                const modalContent = document.getElementById('modal-content');
                modalContent.classList.remove('warning-red');

                if (q8WrongCount === 1) {
                    modalContent.innerText = shouldShowHint ? hint : "……為什麼？";
                    restoreDefaultModalBtn();
                    document.getElementById('hint-modal').classList.remove('hidden');
                } else if (q8WrongCount === 2) {
                    document.body.classList.add('forced-dark');
                    modalContent.innerText = shouldShowHint ? hint : "為什麼？";
                    modalContent.classList.add('warning-red');
                    restoreDefaultModalBtn();
                    document.getElementById('hint-modal').classList.remove('hidden');
                } else if (q8WrongCount >= 3) {
                    const punishText = (index === 1) ? "還不夠" : "為什麼";
                    document.getElementById('matrix-filler').innerText = punishText;
                    
                    const redScreen = document.getElementById('red-punishment-screen');
                    redScreen.classList.remove('hidden');
                    setTimeout(() => {
                        redScreen.classList.add('hidden');
                        document.getElementById('matrix-filler').innerText = '';
                        loadQuestion(); 
                    }, 3000);
                }
                return;
            }

            if (currentData.isSpecialQ11) {
                selectedOptionIndex = index;
                currentData.options[index].hasRevealed = true;
                
                const items = document.querySelectorAll('.option-item');
                const labels = ['A. ', 'B. ', 'C. ', 'D. '];
                
                items.forEach((item, idx) => {
                    const optData = currentData.options[idx];
                    
                    if (optData.hasRevealed) {
                        item.innerText = labels[idx] + optData.revealed;
                        item.classList.add('q11-revealed');
                    } else {
                        item.innerText = labels[idx] + optData.initial;
                        item.classList.remove('q11-revealed');
                    }
                    
                    if (idx === index) {
                        item.classList.add('selected');
                    } else {
                        item.classList.remove('selected');
                    }
                });
                
                document.getElementById('next-btn').disabled = false;
                return;
            }

            if (currentData.isSpecialQ15) {
                selectedOptionIndex = index;
                const items = document.querySelectorAll('.option-item');
                items.forEach((item, idx) => {
                    if (idx === index) {
                        item.classList.add('selected');
                    } else {
                        item.classList.remove('selected');
                    }
                });
                showQ15Modal();
                return;
            }

            selectedOptionIndex = index;
            const items = document.querySelectorAll('.option-item');
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
            
            if (hint && hintId) {
                if (!triggeredHints[hintId]) {
                    triggeredHints[hintId] = true; 
                    document.getElementById('modal-content').innerText = hint;
                    restoreDefaultModalBtn();
                    document.getElementById('hint-modal').classList.remove('hidden');
                } else {
                    document.getElementById('next-btn').disabled = false;
                }
            } else {
                document.getElementById('next-btn').disabled = false;
            }
        }

        function closeModal() {
            const currentData = questions[currentQuestionIndex];
            
            if (currentData.isSpecialQ14) {
                if (q14ModalStage === 1) {
                    q14ModalStage = 2;
                    const modalContent = document.getElementById('modal-content');
                    modalContent.innerText = "您當然願意，不是嗎？";
                    document.getElementById('modal-close-btn').innerText = "……是的";
                    return; 
                } else if (q14ModalStage === 2) {
                    document.getElementById('hint-modal').classList.add('hidden');
                    document.getElementById('modal-content').classList.remove('warning-red');
                    restoreDefaultModalBtn(); 
                    proceedToNext();
                    return;
                }
            }

            document.getElementById('hint-modal').classList.add('hidden');
            document.getElementById('modal-content').classList.remove('warning-red');
            restoreDefaultModalBtn();
            
            if (currentData.isSpecialQ8) {
                loadQuestion();
            } else {
                document.getElementById('next-btn').disabled = false;
            }
        }

        function nextQuestion() {
            const currentData = questions[currentQuestionIndex];

            if (currentData.isSpecialQ14) {
                q14ModalStage = 1;
                const modalContent = document.getElementById('modal-content');
                modalContent.innerText = "您不需要";
                modalContent.classList.add('warning-red');
                restoreDefaultModalBtn();
                document.getElementById('modal-close-btn').innerText = "關閉";
                document.getElementById('hint-modal').classList.remove('hidden');
                return;
            }

            if (selectedOptionIndex === null) return;
            
            if (currentData.isSpecialQ7) {
                const blackout = document.getElementById('blackout-screen');
                document.getElementById('blackout-content').innerText = "非常好……";
                blackout.classList.remove('hidden');
                
                setTimeout(() => {
                    blackout.classList.add('hidden');
                    proceedToNext();
                }, 2000);
            } else if (currentData.isSpecialQ8 && selectedOptionIndex === 0) {
                document.body.classList.remove('forced-dark');
                clearTimeout(q8Timer);
                proceedToNext();
            } else if (currentData.isSpecialQ12) {
                proceedToNext();
            } else {
                proceedToNext();
            }
        }

        function proceedToNext() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                resetIdleTime(); 
                showEndScreen();
            }

        // ================= 結算畫面 =================
        const wait = ms => new Promise(res => setTimeout(res, ms));

        function showEndScreen() {
            document.getElementById('survey-container').classList.add('hidden');
            document.getElementById('true-end-screen').classList.remove('hidden');
            
            setTimeout(() => {
                document.getElementById('final-input').focus();
            }, 100);

            const inputVal = document.getElementById('final-input').value;
            const btn = document.getElementById('final-submit');
            
            if (isRestrictedToYes) {
                if (inputVal.trim().toLowerCase() === 'yes') {
                    btn.disabled = false;
                } else {
                    btn.disabled = true;
                }
            }
        }

            if (e.key === 'Enter') {

            }

                case 'darling':
                case 'dear':
                    endTextEl.innerText = "My dear, don't run…"; await wait(3000);

                    await showFinalEnding("Now, let's complete the legend, hum?");

        async function triggerNoMultiply() {
            const container = document.getElementById('no-multiply-container');
            const endTextEl = document.getElementById('end-message');
            container.classList.remove('hidden');
            let count = 0;
            
            return new Promise(resolve => {
                const interval = setInterval(() => {
                    const span = document.createElement('span');
                    span.innerText = "Why not?";
                    span.style.position = 'absolute';
                    span.style.color = '#ff1a1a';
                    span.style.fontSize = (Math.random() * 40 + 16) + 'px'; 
                    span.style.left = (Math.random() * 100) + 'vw';
                    span.style.top = (Math.random() * 100) + 'vh';
                    span.style.whiteSpace = 'nowrap';
                    span.style.transform = 'translate(-50%, -50%)';
                    span.style.fontWeight = 'bold';
                    span.style.zIndex = count; 
                    container.appendChild(span);
                    count++;
                    
                    if (count > 300) { 
                        clearInterval(interval);
                        
                        setTimeout(() => {
                            container.innerHTML = '';
                            container.classList.add('hidden');
                            endTextEl.innerText = ''; 
                            
                            setTimeout(() => {
                                resolve();
                            }, 10); 
                            
                        }, 1000); 
                    }
                }, 10);
            });
        }

        async function showFinalEnding(text) {
            const endTextEl = document.getElementById('end-message');
            endTextEl.innerText = text;
            
            await wait(5000);
            
            endTextEl.innerText = ""; 
            const trueEndScreen = document.getElementById('true-end-screen');
            trueEndScreen.style.backgroundColor = "#f4edd2"; 
            
            await wait(2500); 
            
            document.getElementById('restart-container').classList.remove('hidden');
        }
    </script>

</body>
</html>
