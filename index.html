<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口腔健康與習慣調查</title>
    <style>
        /* 19世紀簡約古典風格 */
        body {
            background-color: #f4edd2; /* 仿舊紙張色 */
            color: #2b251f; /* 深碳焦黑 */
            font-family: "Times New Roman", "Georgia", "Noto Serif TC", "Songti TC", serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        #survey-container {
            max-width: 600px;
            width: 100%;
            border: 1px solid #a1947b;
            padding: 50px 40px;
            background-color: #fbf8eb;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.5s ease, border-color 0.5s ease;
        }

        /* 裝飾性雙邊框細線 */
        #survey-container::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px solid #d3c9b3;
            pointer-events: none;
            transition: border-color 0.5s ease;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px double #a1947b;
            padding-bottom: 30px;
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }

        .author {
            font-size: 14px;
            font-style: italic;
            color: #5c5146;
            margin: 0 0 25px 0;
            letter-spacing: 1px;
        }

        .introduction {
            font-size: 15px;
            line-height: 1.8;
            color: #4a3f35;
            max-width: 450px;
            margin: 0 auto;
            text-align: justify;
        }

        /* 互動區域 */
        .content-section {
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .progress-indicator {
            font-size: 14px;
            font-style: italic;
            color: #7a6f62;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: center;
            font-weight: normal;
        }

        /* 選項清單樣式 */
        .options-list {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .option-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #2b251f;
            border: 1px solid #d3c9b3;
            text-align: left;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .option-item:hover:not(:disabled) {
            background-color: #f4edd2;
            border-color: #a1947b;
        }

        /* 被選中的選項樣式 */
        .option-item.selected {
            background-color: #2b251f;
            color: #fbf8eb;
            border-color: #2b251f;
        }

        .btn-container {
            text-align: center;
            width: 100%;
        }

        button.action-btn {
            background-color: transparent;
            color: #2b251f;
            border: 1px solid #2b251f;
            padding: 10px 28px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        button.action-btn:hover:not(:disabled) {
            background-color: #2b251f;
            color: #fbf8eb;
        }

        /* 按鈕禁用狀態 */
        button.action-btn:disabled {
            border-color: #d3c9b3;
            color: #a1947b;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* 古典風格提示框 (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(43, 37, 31, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: #fbf8eb;
            border: 1px solid #a1947b;
            padding: 35px 30px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .modal-box::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid #d3c9b3;
            pointer-events: none;
        }

        .modal-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #2b251f;
            font-style: italic;
        }

        /* 全黑遮罩 */
        .blackout-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .blackout-text {
            color: #ffffff;
            font-size: 24px;
            letter-spacing: 4px;
            font-family: inherit;
        }

        /* 第8題專用：滿版紅色處罰畫面（加粗斜體） */
        #red-punishment-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ff1a1a;
            font-size: 32px;
            font-weight: bold;
            font-style: italic; /* 斜體修飾 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            word-break: break-all;
            padding: 30px;
            box-sizing: border-box;
            z-index: 3000;
            letter-spacing: 6px;
            line-height: 1.8;
            overflow: hidden;
        }

        /* 網頁被迫整體黑化樣式 */
        body.forced-dark {
            background-color: #0a0a0a !important;
            color: #8a8275 !important;
        }
        body.forced-dark #survey-container {
            background-color: #121212 !important;
            border-color: #444444 !important;
        }
        body.forced-dark #survey-container::before {
            border-color: #222222 !important;
        }
        body.forced-dark .option-item {
            color: #8a8275 !important;
            border-color: #333333 !important;
        }
        body.forced-dark .option-item:hover:not(:disabled) {
            background-color: #222222 !important;
        }
        body.forced-dark .option-item.selected {
            background-color: #8a8275 !important;
            color: #121212 !important;
        }
        body.forced-dark button.action-btn {
            color: #8a8275 !important;
            border-color: #8a8275 !important;
        }
        body.forced-dark button.action-btn:hover:not(:disabled) {
            background-color: #8a8275 !important;
            color: #121212 !important;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="survey-container">
        
        <div id="welcome-screen">
            <div class="header-section">
                <h1>口腔健康與習慣調查</h1>
                <div class="author">芬森·亨特</div>
                <p class="introduction">
                    本問卷旨在調查口腔健康與衛生習慣，請依據您的習慣作答。
                </p>
            </div>

            <div class="content-section">
                <div class="btn-container">
                    <button class="action-btn" onclick="startSurvey()">開始作答</button>
                </div>
            </div>
        </div>

        <div id="question-screen" class="hidden">
            <div class="content-section">
                <div id="progress" class="progress-indicator"></div>
                <div id="question-text" class="question-text"></div>
                <div id="options-container" class="options-list"></div>
                
                <div class="btn-container">
                    <button id="next-btn" class="action-btn" onclick="nextQuestion()" disabled>下一題</button>
                </div>
            </div>
        </div>

        <div id="end-screen" class="hidden">
            <div class="header-section">
                <h1>調查結束</h1>
                <div class="author">芬森·亨特</div>
                <p class="introduction" style="text-align: center;">
                    感謝您的參與。數據已記錄。
                </p>
            </div>
        </div>

    </div>

    <div id="hint-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="modal-content" class="modal-text"></div>
            <button class="action-btn" onclick="closeModal()">關閉</button>
        </div>
    </div>

    <div id="blackout-screen" class="blackout-overlay hidden">
        <div id="blackout-content" class="blackout-text">這就對了</div>
    </div>

    <div id="red-punishment-screen" class="hidden">
        <div>為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼為什麼</div>
    </div>

    <script>
        // 題目數據庫
        const questions = [
            {
                question: "1. 您刷牙的頻率如何？",
                options: [{ text: "餐後刷牙" }, { text: "早/晚刷牙" }, { text: "想到才刷牙" }, { text: "幾乎不刷牙" }]
            },
            {
                question: "2. 您刷牙時是否使用牙粉(Tooth Powder)？",
                options: [{ text: "每次都使用" }, { text: "偶爾使用" }, { text: "從不使用" }, { text: "……那是什麼？" }]
            },
            {
                question: "3. 您是否使用漱口水(Mouthwashes)？",
                options: [{ text: "每天使用" }, { text: "偶爾使用" }, { text: "很少使用" }, { text: "從不使用" }]
            },
            {
                question: "4. 您是否曾罹患齲齒？",
                options: [
                    { text: "從未" },
                    { text: "曾罹患，已治療" },
                    { text: "目前罹患，未治療", hint: "建議盡快就醫" },
                    { text: "什麼是齲齒？", hint: "是蛀牙的意思呢" }
                ]
            },
            {
                question: "5. 您是否固定至牙科看診？",
                options: [
                    { text: "每半年一次或更多", hint: "乖孩子……" },
                    { text: "每年一次或更少", hint: "還能再進步呢……" },
                    { text: "有狀況才看診", hint: "這並不是好習慣……" },
                    { text: "從未看過牙科", hint: "為什麼不……？" }
                ]
            },
            {
                question: "6. 您是否知道什麼是「根管治療」？",
                options: [{ text: "十分了解" }, { text: "大概知道" }, { text: "不太清楚" }, { text: "從未聽說" }]
            },
            {
                question: "7. 您是否相信「光療法」？",
                isSpecialQ7: true,
                options: [{ text: "深信不疑" }, { text: "相信" }, { text: "不相信" }, { text: "光療法是什麼？" }]
            },
            {
                question: "8. 您是否相信我……？",
                isSpecialQ8: true,
                options: [
                    { initial: "……什麼？", final: "當然" },
                    { initial: "……什麼？", final: "也許會" },
                    { initial: "……什麼？", final: "也許會不" },
                    { initial: "……什麼？", final: "拒絕相信" }
                ]
            },
            // 以下為 9~15 題預留位置
            { question: "9. （等待題目更新...）", options: [{text:"選項A"}, {text:"選項B"}, {text:"選項C"}, {text:"選項D"}] },
            { question: "10. （等待題目更新...）", options: [{text:"選項A"}, {text:"選項B"}, {text:"選項C"}, {text:"選項D"}] },
            { question: "11. （等待題目更新...）", options: [{text:"選項A"}, {text:"選項B"}, {text:"選項C"}, {text:"選項D"}] },
            { question: "12. （等待題目更新...）", options: [{text:"選項A"}, {text:"選項B"}, {text:"選項C"}, {text:"選項D"}] },
            { question: "13. （等待題目更新...）", options: [{text:"選項A"}, {text:"選項B"}, {text:"選項C"}, {text:"選項D"}] },
            { question: "14. （等待題目更新...）", options: [{text:"選項A"}, {text:"選項B"}, {text:"選項C"}, {text:"選項D"}] },
            { question: "15. （等待題目更新...）", options: [{text:"選項A"}, {text:"選項B"}, {text:"選項C"}, {text:"選項D"}] }
        ];

        let currentQuestionIndex = 0;
        let selectedOptionIndex = null;
        
        let q8WrongCount = 0; 
        let q8Timer = null;
        let q8TextsRevealed = false;
        let disabledOptionsQ8 = [false, false, false, false];

        function startSurvey() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            selectedOptionIndex = null;
            document.getElementById('next-btn').disabled = true;
            
            const currentData = questions[currentQuestionIndex];
            
            document.getElementById('progress').innerText = `${currentQuestionIndex + 1} / 15`;
            document.getElementById('question-text').innerText = currentData.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const labels = ['A. ', 'B. ', 'C. ', 'D. '];
            
            if (currentData.isSpecialQ8) {
                q8TextsRevealed = false;
                currentData.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-item';
                    btn.id = `q8-opt-${index}`;
                    btn.innerText = labels[index] + opt.initial;
                    btn.onclick = () => selectOption(index, null);
                    if (disabledOptionsQ8[index]) btn.disabled = true;
                    container.appendChild(btn);
                });

                q8Timer = setTimeout(() => {
                    q8TextsRevealed = true;
                    currentData.options.forEach((opt, index) => {
                        const btn = document.getElementById(`q8-opt-${index}`);
                        if (btn) {
                            btn.innerText = labels[index] + opt.final;
                        }
                    });
                }, 3000);

            } else {
                currentData.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-item';
                    btn.innerText = labels[index] + opt.text;
                    btn.onclick = () => selectOption(index, opt.hint);
                    container.appendChild(btn);
                });
            }
        }

        function selectOption(index, hint) {
            const currentData = questions[currentQuestionIndex];
            
            if (currentData.isSpecialQ8 && index !== 0) {
                q8WrongCount++;
                disabledOptionsQ8[index] = true;
                document.getElementById('next-btn').disabled = true;

                if (q8WrongCount === 1) {
                    // 第一次錯：色調不改變，只跳提示框
                    document.getElementById('modal-content').innerText = "……為什麼？";
                    document.getElementById('hint-modal').classList.remove('hidden');
                } else if (q8WrongCount === 2) {
                    // 第二次錯：畫面轉黑，跳提示框
                    document.body.classList.add('forced-dark');
                    document.getElementById('modal-content').innerText = "為什麼？";
                    document.getElementById('hint-modal').classList.remove('hidden');
                } else if (q8WrongCount >= 3) {
                    // 第三次錯：斜體紅字充斥全畫面
                    const redScreen = document.getElementById('red-punishment-screen');
                    redScreen.classList.remove('hidden');
                    setTimeout(() => {
                        redScreen.classList.add('hidden');
                        loadQuestion();
                    }, 3000);
                }
                return;
            }

            selectedOptionIndex = index;
            const items = document.querySelectorAll('.option-item');
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('selected');
                    if (currentData.isSpecialQ7 && index > 0) {
                        const labels = ['A. ', 'B. ', 'C. ', 'D. '];
                        item.innerText = labels[index] + "深信不疑";
                    }
                } else {
                    item.classList.remove('selected');
                }
            });
            
            if (hint) {
                document.getElementById('modal-content').innerText = hint;
                document.getElementById('hint-modal').classList.remove('hidden');
            } else {
                document.getElementById('next-btn').disabled = false;
            }
        }

        function closeModal() {
            document.getElementById('hint-modal').classList.add('hidden');
            const currentData = questions[currentQuestionIndex];
            
            if (currentData.isSpecialQ8) {
                loadQuestion();
            } else {
                document.getElementById('next-btn').disabled = false;
            }
        }

        function nextQuestion() {
            if (selectedOptionIndex === null) return;
            
            const currentData = questions[currentQuestionIndex];
            
            if (currentData.isSpecialQ7) {
                const blackout = document.getElementById('blackout-screen');
                document.getElementById('blackout-content').innerText = "這就對了";
                blackout.classList.remove('hidden');
                
                setTimeout(() => {
                    blackout.classList.add('hidden');
                    proceedToNext();
                }, 2000);
            } else if (currentData.isSpecialQ8 && selectedOptionIndex === 0) {
                document.body.classList.remove('forced-dark');
                clearTimeout(q8Timer);
                proceedToNext();
            } else {
                proceedToNext();
            }
        }

        function proceedToNext() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
        }
    </script>

</body>
</html>
